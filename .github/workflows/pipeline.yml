name: Pipeline
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: if test -f playwright.config.ts; then npx playwright install --with-deps chromium firefox; fi
      - run: ./localPipeline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            coverage
            playwright-report
